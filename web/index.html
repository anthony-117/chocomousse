<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="TravelGenie: plan your trip in one place">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TravelGenie">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TravelGenie</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #FFFFFF; }
    #loader {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 20px; font: 700 28px/1 system-ui, sans-serif; color: #14142B;
    }
    #loader b { color: #4338CA; }
    #loader i { color: #FF7A59; font-style: normal; }
    #loader span {
      width: 28px; height: 28px; border-radius: 50%; border: 3px solid #E4E4EE; border-top-color: #4338CA;
      animation: spin .9s linear infinite;
    }
    #loader small { font: 400 14px/1 system-ui, sans-serif; color: #6B6B85; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Shown until Flutter draws its first frame, because the app takes a few seconds to download and start. -->
  <div id="loader" role="status">
    <div>travel<b>genie</b><i>.</i></div>
    <span></span>
    <small>Loading your trip planner…</small>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('loader').remove();
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
