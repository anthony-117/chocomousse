# Strict linting (like Rust's clippy): very_good_analysis enables almost every Dart lint.
# `flutter analyze --fatal-infos` in CI fails on any finding. Deliberate exceptions are listed below with a reason.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # Line length is enforced by the formatter (page_width: 120 below), not the 80-column lint.
    lines_longer_than_80_chars: false
    # This is an app, not a published package: public API docs only where they help.
    public_member_api_docs: false
    # Dart 3.13's `new(...)` constructor shorthand: kept off so constructors read like every Flutter doc and example.
    unnecessary_type_name_in_constructor: false

formatter:
  page_width: 120
