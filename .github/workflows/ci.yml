name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Install packages
        run: flutter pub get

      # Like `cargo fmt --check`.
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      # very_good_analysis; any finding, even an info, fails (like `cargo clippy -D warnings`).
      - name: Analyze
        run: flutter analyze --fatal-infos

      # Every test must pass; a single failing test fails the build.
      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --release
